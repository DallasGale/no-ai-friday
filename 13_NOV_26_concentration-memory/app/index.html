<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Socket.IO chat</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- Boilerplate UI -->
  <form id="form" action="">
    <input id="input" autocomplete="off" placeholder="Your name" /><button>Send</button>
  </form>
  <ul id="players">Players</ul>
  <button id="start-game" disabled>START</button>
  <div id="cards-parent" class="cards-parent">
  </div>

  <!-- <script src="/js/index.module.js" type="module"></script> -->
  <!-- <script src="/js/data.js"></script> -->
  <script src="/socket.io/socket.io.js"></script>
  <!-- <script src="https://cdn.socket.io/4.8.4/socket.io.min.js"></script> -->
  <script type="module">
    import cardData from "/js/data.module.js"
    import init from "/js/index.module.js"

    init

    const socket = io();
    const form = document.getElementById('form')
    const input = document.getElementById('input')
    const players = document.getElementById("players")

    let id = 0



    form.addEventListener("submit", (e) => {
      e.preventDefault()
      if (input.value) {
        socket.emit("user name", input.value)
        input.value = ''
      }
    });
    socket.on("user name", (user) => {
      console.log("found a user", { user, socket })
      const item = document.createElement("li");
      id += 1
      item.id = id
      item.dataset.current = id === 1 ? true : false
      // item.id = socket.id
      item.innerHTML = `Player ${id} is ${user}. Points <span class="player" id="player-${id}-points">0</span>`
      players.appendChild(item)

      if (window) {
        console.log("setting storage", user, socket.id, { id })
        // console.log(`{ "id": "${socket.id}", "name": "${user}" }`)
        window.localStorage.setItem(`player-${id}`,
          `{ "id": "${socket.id}", "name": "${user}" }`,
        )
      }

    })

  </script>
</body>

</html>
